name: Improvement proposal
description: Suggest an improvement to a concrete user workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and preservation requirements
      description: Explain the result, any supported public interface, and what must remain unchanged. Do not include private data.
    validations:
      required: true
